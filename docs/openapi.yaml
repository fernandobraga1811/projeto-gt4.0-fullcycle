openapi: 3.1.0
info:
  title: Pedidos API
  version: 1.0.0
  description: API de pedidos do Projeto Final (Projeto B). Valores monetários em centavos.
servers:
  - url: http://localhost:3000
paths:
  /orders:
    post:
      summary: Cria um pedido
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrder'
      responses:
        '201':
          description: Pedido criado
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Error'
    get:
      summary: Lista pedidos (mais novos primeiro)
      operationId: listOrders
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Lista de pedidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Error'
  /orders/{id}:
    get:
      summary: Consulta um pedido
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/Error'
  /orders/{id}/status:
    patch:
      summary: Altera o status do pedido
      operationId: changeOrderStatus
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/Status'
      responses:
        '200':
          description: Status alterado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /health:
    get:
      summary: Verificação de saúde
      operationId: health
      responses:
        '200':
          description: API saudável
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, examples: [ok] }
  /metrics:
    get:
      summary: Métricas no formato Prometheus
      operationId: metrics
      responses:
        '200':
          description: Métricas em texto
          content:
            text/plain:
              schema:
                type: string
components:
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Erro
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
  schemas:
    Status:
      type: string
      enum: [CREATED, PAID, SHIPPED, DELIVERED, CANCELLED]
    Item:
      type: object
      required: [sku, quantity, unitPriceCents]
      properties:
        sku: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPriceCents: { type: integer, minimum: 0 }
    NewOrder:
      type: object
      required: [customer, items]
      properties:
        customer: { type: string, minLength: 2 }
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Item'
    Order:
      type: object
      required: [id, customer, items, totalCents, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        customer: { type: string }
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        totalCents: { type: integer }
        status:
          $ref: '#/components/schemas/Status'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
